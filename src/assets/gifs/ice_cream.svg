<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      @keyframes iceCreamSway {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
      }
      @keyframes dripFall {
        0%, 100% { transform: translateY(0) scaleY(1); }
        50% { transform: translateY(3.5px) scaleY(1.2); }
      }
      @keyframes sparkle {
        0%, 100% { opacity: 0.3; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      .cone-group { animation: iceCreamSway 3s ease-in-out infinite; transform-origin: 60px 105px; }
      .drip { animation: dripFall 2.2s ease-in-out infinite; transform-origin: top center; }
      .sparkle1 { animation: sparkle 1.8s ease-in-out infinite; transform-origin: center; }
      .sparkle2 { animation: sparkle 1.8s ease-in-out infinite 0.9s; transform-origin: center; }
    </style>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="strawberryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="40%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="vanillaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="cherryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Sparkles -->
  <g fill="#F59E0B">
    <path class="sparkle1" d="M 30 24 L 32 18 L 34 24 L 40 26 L 34 28 L 32 34 L 30 28 L 24 26 Z" />
    <path class="sparkle2" d="M 88 32 L 90 26 L 92 32 L 98 34 L 92 36 L 90 42 L 88 36 L 82 34 Z" fill="#EC4899" />
  </g>

  <!-- Shadow -->
  <ellipse cx="60" cy="110" rx="28" ry="7" fill="#E7E5E4" opacity="0.6" />

  <g class="cone-group">
    <!-- Waffle Cone -->
    <path d="M 40 68 L 60 110 L 80 68 Z" fill="url(#coneGrad)" />
    <!-- Waffle Cross Grid Pattern -->
    <g stroke="#92400E" stroke-width="1.2" opacity="0.6" stroke-linecap="round">
      <line x1="45" y1="74" x2="68" y2="98" />
      <line x1="50" y1="83" x2="65" y2="103" />
      <line x1="75" y1="74" x2="52" y2="98" />
      <line x1="70" y1="83" x2="55" y2="103" />
    </g>

    <!-- Bottom Scoop (Vanilla / Mango) -->
    <circle cx="60" cy="58" r="22" fill="url(#vanillaGrad)" />
    <!-- Vanilla Ruffles / Scoop Bottom -->
    <path d="M 37 68 C 42 72 48 72 52 68 C 56 72 64 72 68 68 C 72 72 78 72 83 68 C 84 64 83 60 81 58 C 75 56 68 56 60 56 C 52 56 45 56 39 58 Z" fill="#FDE68A" />

    <!-- Top Scoop (Strawberry / Berry Swirl) -->
    <circle cx="60" cy="38" r="20" fill="url(#strawberryGrad)" />
    <!-- Berry Scoop Ruffles -->
    <path d="M 41 46 C 45 50 51 50 55 47 C 59 50 66 50 70 47 C 74 50 78 49 80 46 C 81 40 80 34 76 30 C 70 26 64 26 60 26 C 56 26 50 26 44 30 Z" fill="#F43F5E" />

    <!-- Sprinkles on Scoop -->
    <rect x="52" y="30" width="4" height="1.8" rx="0.9" fill="#3B82F6" transform="rotate(25 52 30)" />
    <rect x="66" y="32" width="4" height="1.8" rx="0.9" fill="#10B981" transform="rotate(-30 66 32)" />
    <rect x="56" y="40" width="4" height="1.8" rx="0.9" fill="#FBBF24" transform="rotate(15 56 40)" />
    <rect x="68" y="44" width="4" height="1.8" rx="0.9" fill="#EC4899" transform="rotate(45 68 44)" />
    <rect x="46" y="38" width="4" height="1.8" rx="0.9" fill="#8B5CF6" transform="rotate(-15 46 38)" />

    <!-- Melting Drips -->
    <g class="drip">
      <path d="M 44 68 C 44 76 48 76 48 68 Z" fill="#FDE68A" />
      <path d="M 68 68 C 68 78 72 78 72 68 Z" fill="#FDE68A" />
    </g>

    <!-- Glossy Cherry on Top -->
    <circle cx="60" cy="18" r="7" fill="url(#cherryGrad)" />
    <ellipse cx="58" cy="16" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.75" />
    <!-- Cherry Stem -->
    <path d="M 60 14 Q 68 6 72 8" stroke="#15803D" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>
</svg>
