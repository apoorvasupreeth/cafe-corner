<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      @keyframes cheeseDrip {
        0%, 100% { transform: translateY(0) scaleY(1); }
        50% { transform: translateY(3px) scaleY(1.15); }
      }
      @keyframes steamRise {
        0% { opacity: 0; transform: translateY(4px) scale(0.8); }
        50% { opacity: 0.85; transform: translateY(-3px) scale(1.1); }
        100% { opacity: 0; transform: translateY(-10px) scale(1.3); }
      }
      @keyframes toastGlow {
        0%, 100% { filter: drop-shadow(0 2px 4px rgba(217, 119, 6, 0.2)); }
        50% { filter: drop-shadow(0 4px 8px rgba(217, 119, 6, 0.4)); }
      }
      .steam1 { animation: steamRise 2.4s ease-in-out infinite; transform-origin: center; }
      .steam2 { animation: steamRise 2.4s ease-in-out infinite 0.8s; transform-origin: center; }
      .steam3 { animation: steamRise 2.4s ease-in-out infinite 1.6s; transform-origin: center; }
      .cheese { animation: cheeseDrip 2s ease-in-out infinite; transform-origin: top center; }
      .toast { animation: toastGlow 3s ease-in-out infinite; }
    </style>
    <linearGradient id="breadTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Steam Puffs -->
  <g fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <path class="steam1" d="M 42 28 Q 46 20 40 12" />
    <path class="steam2" d="M 60 25 Q 65 17 58 8" />
    <path class="steam3" d="M 78 28 Q 74 20 80 12" />
  </g>

  <!-- Sandwich Plate / Shadow -->
  <ellipse cx="60" cy="98" rx="46" ry="12" fill="#E7E5E4" opacity="0.6" />

  <!-- Bottom Bread Slice -->
  <g class="toast">
    <path d="M 22 76 L 60 40 L 98 76 L 60 92 Z" fill="url(#crust)" rx="4" />
    <path d="M 24 74 L 60 42 L 96 74 L 60 89 Z" fill="url(#breadTop)" />

    <!-- Fillings: Green lettuce / veggies -->
    <path d="M 28 72 Q 40 76 52 73 Q 66 77 78 72 Q 88 75 94 71" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Tomato slice -->
    <circle cx="48" cy="73" r="3" fill="#EF4444" />
    <circle cx="72" cy="73" r="3" fill="#EF4444" />

    <!-- Melting Cheese Layer -->
    <g class="cheese">
      <path d="M 26 73 Q 36 78 44 75 Q 52 86 58 76 Q 68 88 74 76 Q 84 79 94 73" fill="url(#cheeseGrad)" />
      <!-- Dripping cheese drop -->
      <path d="M 56 78 C 56 86 60 88 60 82 C 60 78 56 78 56 78 Z" fill="#F59E0B" />
    </g>

    <!-- Top Bread Slice (Triangular Grill Sandwich) -->
    <path d="M 20 68 L 60 30 L 100 68 L 60 84 Z" fill="url(#crust)" />
    <path d="M 22 66 L 60 32 L 98 66 L 60 81 Z" fill="url(#breadTop)" />

    <!-- Dark Brown Grill Marks -->
    <g stroke="#78350F" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <line x1="38" y1="50" x2="52" y2="64" />
      <line x1="48" y1="42" x2="66" y2="60" />
      <line x1="60" y1="36" x2="78" y2="54" />
      <line x1="72" y1="42" x2="86" y2="56" />
    </g>

    <!-- Golden Butter Sheen -->
    <ellipse cx="60" cy="56" rx="10" ry="4" fill="#FEF3C7" opacity="0.5" />
  </g>
</svg>
