<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      @keyframes steamFloat {
        0% { opacity: 0; transform: translateY(6px) scaleX(0.8); }
        50% { opacity: 0.9; transform: translateY(-4px) scaleX(1.1); }
        100% { opacity: 0; transform: translateY(-14px) scaleX(1.3); }
      }
      @keyframes forkLift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .steam-line-1 { animation: steamFloat 2.1s ease-in-out infinite; transform-origin: center; }
      .steam-line-2 { animation: steamFloat 2.1s ease-in-out infinite 0.7s; transform-origin: center; }
      .steam-line-3 { animation: steamFloat 2.1s ease-in-out infinite 1.4s; transform-origin: center; }
      .fork-group { animation: forkLift 2.6s ease-in-out infinite; transform-origin: center; }
    </style>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="60%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="maggiNoodle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="masalaCurry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Steaming Heat Waves -->
  <g fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path class="steam-line-1" d="M 44 26 Q 48 16 42 6" />
    <path class="steam-line-2" d="M 60 22 Q 66 12 58 4" />
    <path class="steam-line-3" d="M 76 26 Q 72 16 78 6" />
  </g>

  <!-- Bowl Shadow -->
  <ellipse cx="60" cy="104" rx="44" ry="10" fill="#E7E5E4" opacity="0.6" />

  <!-- Bowl Outer Rim & Base -->
  <path d="M 18 62 C 18 94 40 102 60 102 C 80 102 102 94 102 62 Z" fill="url(#bowlGrad)" />
  <!-- Bowl Base Foot -->
  <ellipse cx="60" cy="100" rx="20" ry="4" fill="#7F1D1D" />

  <!-- Yellow Accent Stripe on Red Maggi Bowl -->
  <path d="M 24 72 Q 60 92 96 72" stroke="#FCD34D" stroke-width="3" fill="none" opacity="0.9" stroke-linecap="round" />

  <!-- Rich Masala Soup Base -->
  <ellipse cx="60" cy="62" rx="40" ry="14" fill="url(#masalaCurry)" />

  <!-- Curly Maggi Noodle Clusters -->
  <g fill="none" stroke="url(#maggiNoodle)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 62 Q 34 54 42 60 Q 50 66 58 58 Q 66 52 74 60 Q 82 66 90 60" />
    <path d="M 32 66 Q 40 70 48 64 Q 56 58 64 66 Q 72 72 80 64 Q 88 66 92 64" />
    <path d="M 36 58 Q 44 54 52 62 Q 60 68 68 60 Q 76 54 84 58" />
    <path d="M 42 64 Q 50 60 58 66 Q 66 60 74 65" />
  </g>

  <!-- Maggi Veggie Garnishes: Peas & Carrots -->
  <circle cx="36" cy="62" r="3" fill="#10B981" />
  <circle cx="78" cy="66" r="3" fill="#10B981" />
  <circle cx="56" cy="56" r="3" fill="#10B981" />
  <rect x="46" y="62" width="4.5" height="4.5" rx="1" fill="#F97316" transform="rotate(15 46 62)" />
  <rect x="68" y="58" width="4.5" height="4.5" rx="1" fill="#F97316" transform="rotate(-20 68 58)" />

  <!-- Fork Twirling Maggi Noodles (Animated Lift) -->
  <g class="fork-group">
    <!-- Steel Fork Prongs & Neck -->
    <path d="M 52 46 L 52 28 M 56 46 L 56 28 M 60 46 L 60 28 M 64 46 L 64 28" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <path d="M 50 36 C 50 42 66 42 66 36 L 62 20 L 58 20 Z" fill="#CBD5E1" />
    <!-- Fork Long Handle -->
    <path d="M 60 20 L 68 2" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

    <!-- Strands of Curly Maggi wrapped around fork -->
    <path d="M 48 38 Q 58 44 68 36 Q 62 48 50 46" fill="none" stroke="url(#maggiNoodle)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 50 46 Q 58 54 66 46" fill="none" stroke="url(#maggiNoodle)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 54 50 Q 56 60 54 66" fill="none" stroke="url(#maggiNoodle)" stroke-width="3" stroke-linecap="round" />
    <path d="M 62 48 Q 64 58 66 64" fill="none" stroke="url(#maggiNoodle)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
