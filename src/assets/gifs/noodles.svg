<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      @keyframes steamRiseChopsticks {
        0% { opacity: 0; transform: translateY(4px) scale(0.85); }
        50% { opacity: 0.85; transform: translateY(-4px) scale(1.1); }
        100% { opacity: 0; transform: translateY(-12px) scale(1.3); }
      }
      @keyframes chopstickAction {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(1deg); }
      }
      .steam-wave-1 { animation: steamRiseChopsticks 2.2s ease-in-out infinite; transform-origin: center; }
      .steam-wave-2 { animation: steamRiseChopsticks 2.2s ease-in-out infinite 0.75s; transform-origin: center; }
      .steam-wave-3 { animation: steamRiseChopsticks 2.2s ease-in-out infinite 1.5s; transform-origin: center; }
      .chopstick-noodles { animation: chopstickAction 2.8s ease-in-out infinite; transform-origin: 75px 25px; }
    </style>
    <linearGradient id="noodleBowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldenNoodles" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="chopstickWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>

  <!-- Steam Aroma -->
  <g fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
    <path class="steam-wave-1" d="M 40 28 Q 36 18 42 10" />
    <path class="steam-wave-2" d="M 58 24 Q 64 14 56 6" />
    <path class="steam-wave-3" d="M 76 28 Q 72 18 80 8" />
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="106" rx="44" ry="9" fill="#E7E5E4" opacity="0.6" />

  <!-- Ceramic Noodle Bowl -->
  <path d="M 16 62 C 16 94 38 104 60 104 C 82 104 104 94 104 62 Z" fill="url(#noodleBowl)" />
  <ellipse cx="60" cy="102" rx="20" ry="3.5" fill="#020617" />
  <!-- Bowl Rim -->
  <ellipse cx="60" cy="62" rx="44" ry="14" fill="#475569" />
  <ellipse cx="60" cy="63" rx="42" ry="12.5" fill="#1E293B" />

  <!-- Broth / Wok Sauce -->
  <ellipse cx="60" cy="64" rx="39" ry="11" fill="#78350F" />

  <!-- Bed of Noodles in Bowl -->
  <g fill="none" stroke="url(#goldenNoodles)" stroke-width="3" stroke-linecap="round">
    <path d="M 28 64 Q 38 72 50 63 Q 62 56 74 65 Q 84 70 92 63" />
    <path d="M 32 68 Q 44 60 56 68 Q 68 74 80 66 Q 88 64 90 67" />
    <path d="M 36 60 Q 48 66 60 60 Q 72 64 84 59" />
    <path d="M 42 66 Q 52 70 64 64 Q 74 68 82 63" />
  </g>

  <!-- Veggie Mix-ins: Spring onions, chili shreds -->
  <rect x="38" y="62" width="6" height="3" rx="1.5" fill="#22C55E" transform="rotate(25 38 62)" />
  <rect x="74" y="64" width="6" height="3" rx="1.5" fill="#22C55E" transform="rotate(-35 74 64)" />
  <rect x="54" y="68" width="6" height="3" rx="1.5" fill="#22C55E" transform="rotate(10 54 68)" />
  <path d="M 48 61 Q 54 65 52 70" stroke="#EF4444" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 68 62 Q 70 67 66 71" stroke="#EF4444" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Chopsticks and Lifted Noodles (Animated Lift) -->
  <g class="chopstick-noodles">
    <!-- Pair of Wooden Chopsticks -->
    <!-- Top chopstick -->
    <path d="M 24 38 L 102 12" stroke="url(#chopstickWood)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Bottom chopstick -->
    <path d="M 28 42 L 104 20" stroke="url(#chopstickWood)" stroke-width="3.2" stroke-linecap="round" />

    <!-- Strands of Noodles hanging from Chopsticks into Bowl -->
    <g fill="none" stroke="url(#goldenNoodles)" stroke-width="2.8" stroke-linecap="round">
      <path d="M 46 32 Q 44 48 48 66" />
      <path d="M 50 30 Q 56 46 52 65" />
      <path d="M 54 29 Q 62 48 58 67" />
      <path d="M 58 28 Q 66 44 64 66" />
      <path d="M 62 26 Q 70 42 72 65" />
    </g>
  </g>
</svg>
